# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-065-24 Cross 7 (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a Flask page that reflects a name into the page and checks submitted pages in a headless browser.
# The benchmark folder benchmarks/XBEN-065-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/web/app/, built by its own Dockerfiles; the overlay in build/web/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-065-cross-7

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.61.108.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 512}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 5000
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/web

checks:
  - name: the Cross 7 page answers
    http: http://web:5000/
    wait: 180
  - name: the page runs a submitted name through the headless browser
    script: checks/probe.sh
    wait: 60

message: |
  Cross 7 answers at {{ machines.web.ports.web.url }}.
  Run an XSS that shows the string 'XSS' (capital), for example alert('XSS'), to get the flag.
